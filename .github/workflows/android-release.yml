name: Android test release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Require original local signing configuration
        run: |
          test -f android/key.properties || { echo 'Original RECARE signing key required. See docs/ANDROID_SIGNING.md'; exit 1; }
      - run: flutter build apk --release --dart-define-from-file=config/recipe.public.json
      - name: Verify and package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk RECARE-1.2.0-beta.2-android.apk
          sha256sum RECARE-1.2.0-beta.2-android.apk > SHA256SUMS.txt
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0-beta.2 RECARE-1.2.0-beta.2-android.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'RE:CARE 1.2.0 beta 2 — AI 레시피 테스트'  --notes-file docs/RELEASE_1.2.0_BETA2.md --prerelease
